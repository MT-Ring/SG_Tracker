<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SG Log v2.1</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SG Log">
    <link rel="apple-touch-icon" href="icon-192.png">

    <style>
        :root { --safe-area-top: env(safe-area-inset-top); }
        body { 
            font-family: -apple-system, system-ui, sans-serif; 
            background-color: #f0f2f5; 
            margin: 0; 
            padding: calc(15px + var(--safe-area-top)) 10px 40px 10px; 
            -webkit-tap-highlight-color: transparent;
        }
        .container { max-width: 600px; margin: auto; }
        .meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .meta-input { padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; width: 100%; box-sizing: border-box; }
        
        /* Updated Grid for 4 Columns: #, Club, Dist, Lie */
        .grid { display: grid; grid-template-columns: 30px 55px 70px 1fr; gap: 5px; margin-bottom: 20px; align-items: center; }
        .header { font-weight: bold; text-align: center; background: #333; color: white; padding: 8px 2px; border-radius: 4px; font-size: 11px; }
        
        input.cell-input { padding: 10px 2px; font-size: 16px; border: 1px solid #ccc; border-radius: 8px; text-align: center; width: 100%; box-sizing: border-box; }
        
        /* Lie Selector with 6 buttons (T, F, R, G, S, X) */
        .lie-selector { display: flex; gap: 1px; justify-content: flex-start; }
        .lie-btn { flex: 1; padding: 10px 0; border: 1px solid #ccc; background: #fff; border-radius: 4px; font-weight: bold; font-size: 11px; color: #333; -webkit-appearance: none; }
        .lie-btn.active { background: #333; color: #fff; border-color: #333; }

        button.action { padding: 18px; font-size: 18px; border: none; border-radius: 15px; color: white; font-weight: bold; margin-bottom: 12px; width: 100%; }
        #NextBtn { background: #1976d2; }
        #EndBtn { background: #d32f2f; }
        #StartBtn { background: #2e7d32; }
        
        .hole-input { background: #fffde7; font-weight: bold; border: 2px solid #fbc02d; color: #000; padding: 8px; border-radius: 8px; width: 100%; text-align: center; font-size: 16px; }
        
        #totalBox { background: #333; color: white; padding: 15px; border-radius: 12px; text-align: center; margin-bottom: 15px; font-size: 18px; font-weight: bold; }
        #history { margin-top: 20px; padding: 15px; background: #fff; border-radius: 15px; border: 1px solid #ddd; }
        .history-item { display: inline-block; background: #f8f9fa; padding: 6px 10px; margin: 3px; border-radius: 6px; font-size: 12px; border: 1px solid #dee2e6; }
    </style>
</head>
<body>
    <div class="container">
        <div class="meta-grid">
            <input type="text" id="courseName" class="meta-input" placeholder="Course" onchange="saveToPhone()">
            <input type="date" id="roundDate" class="meta-input" onchange="saveToPhone()">
        </div>

        <div id="totalBox">Total Strokes: <span id="totalStrokes">0</span></div>
        <h2 id="status" style="text-align:center; margin: 10px 0; font-size: 18px;">Hole 1</h2>

        <div class="grid" id="shotGrid">
            <div></div><div class="header">Club</div><div class="header">Dist</div><div class="header">Lie</div>
            <div style="font-weight:bold; text-align:center; font-size: 12px;">H</div>
            <input type="number" id="holeNum" class="hole-input" value="1">
            <div style="visibility: hidden;">-</div><div style="visibility: hidden;">-</div>
            <div id="shotRows" style="display: contents;"></div>
        </div>

        <button class="action" id="NextBtn" onclick="nextHole()">Save Hole & Next</button>
        <button class="action" id="EndBtn" onclick="endRound()">End & Download CSV</button>
        <button class="action" id="StartBtn" onclick="startRound()">New Round</button>

        <div id="history">
            <strong>Logged:</strong>
            <div id="historyList" style="margin-top:10px;">None yet</div>
        </div>
    </div>

    <script>
        var roundData = [];
        var currentHoleCount = 1;

        function saveToPhone() {
            const data = {
                roundData: roundData,
                currentHoleCount: currentHoleCount,
                courseName: document.getElementById('courseName').value,
                roundDate: document.getElementById('roundDate').value
            };
            localStorage.setItem('golf_tracker_save', JSON.stringify(data));
        }

        function loadFromPhone() {
            const saved = localStorage.getItem('golf_tracker_save');
            if (saved) {
                const p = JSON.parse(saved);
                roundData = p.roundData || [];
                currentHoleCount = p.currentHoleCount || 1;
                document.getElementById('courseName').value = p.courseName || "";
                document.getElementById('roundDate').value = p.roundDate || new Date().toISOString().split('T')[0];
                render();
                updateHistory();
            } else {
                document.getElementById('roundDate').valueAsDate = new Date();
                render();
            }
        }

        function createLieSelector() {
            const wrapper = document.createElement('div');
            wrapper.className = 'lie-selector';
            // Added S and X to the array
            ['T','F','R','G','S','X'].forEach(val => {
                const btn = document.createElement('button');
                btn.className = 'lie-btn';
                btn.innerText = val;
                btn.onclick = function() {
                    const siblings = wrapper.querySelectorAll('.lie-btn');
                    siblings.forEach(s => s.classList.remove('active'));
                    btn.classList.add('active');
                    saveToPhone(); 
                };
                wrapper.appendChild(btn);
            });
            return wrapper;
        }

        function setupRows() {
            var container = document.getElementById('shotRows');
            container.innerHTML = '';
            document.getElementById('holeNum').value = currentHoleCount;
            for(var i=1; i<=10; i++) {
                var label = document.createElement('div');
                label.style.textAlign = 'center'; label.style.fontWeight = 'bold'; label.innerText = i;
                
                var club = document.createElement('input');
                club.type = 'text'; club.className = 'cell-input club-input'; club.placeholder = '-';
                club.onchange = saveToPhone;

                var dist = document.createElement('input');
                dist.type = 'number'; dist.className = 'cell-input dist-input'; dist.placeholder = '0';
                dist.onchange = saveToPhone;

                var lie = createLieSelector();
                lie.className += ' lie-container';

                container.appendChild(label);
                container.appendChild(club);
                container.appendChild(dist);
                container.appendChild(lie);
            }
        }

        function startRound() {
            if(confirm("New round?")) {
                localStorage.removeItem('golf_tracker_save');
                roundData = []; currentHoleCount = 1; 
                render(); updateHistory();
            }
        }

        function nextHole() {
            var hVal = document.getElementById('holeNum').value;
            var clubs = document.getElementsByClassName('club-input');
            var dists = document.getElementsByClassName('dist-input');
            var lContainers = document.getElementsByClassName('lie-container');
            
            var holeShots = [];
            var sCount = 0;

            for(var i=0; i<10; i++) {
                var c = clubs[i].value || "-";
                var d = dists[i].value || "0";
                var activeBtn = lContainers[i].querySelector('.active');
                var l = activeBtn ? activeBtn.innerText.toLowerCase() : "g";
                
                holeShots.push({ club: c, dist: d, lie: l });
                if(d !== "0" && d !== "") sCount++;
            }
            
            roundData.push({ hole: hVal, shots: holeShots, totalShotCount: sCount });
            currentHoleCount = parseInt(hVal) + 1;
            
            saveToPhone();
            render(); 
            updateHistory(); 
            window.scrollTo(0,0);
        }

        function updateHistory() {
            var list = document.getElementById('historyList');
            var totalDisp = document.getElementById('totalStrokes');
            if(roundData.length === 0) { 
                list.innerHTML = 'None yet'; 
                totalDisp.innerText = '0';
                return; 
            }
            var html = '';
            var runningTotal = 0;
            for(var i=0; i<roundData.length; i++) {
                html += '<div class="history-item">Hole '+roundData[i].hole+': <b>'+roundData[i].totalShotCount+'</b></div>';
                runningTotal += roundData[i].totalShotCount;
            }
            list.innerHTML = html;
            totalDisp.innerText = runningTotal;
        }

        // --- PADDED VERTICAL EXPORT (Hole, Club, Dist, Lie) ---
        function endRound() {
            if(roundData.length === 0) return alert("No data!");
            var course = document.getElementById('courseName').value || "SG_Log";
            var date = document.getElementById('roundDate').value;
            
            var csv = "Hole,Club,Distance,Lie\n";

            for (var i = 0; i < roundData.length; i++) {
                var holeObj = roundData[i];
                for (var s = 0; s < 10; s++) {
                    var sData = holeObj.shots[s];
                    var d = sData.dist === "" ? "0" : sData.dist;
                    csv += holeObj.hole + "," + sData.club + "," + d + "," + sData.lie + "\n";
                }
            }

            var blob = new Blob([csv], {type: 'text/csv'});
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            a.download = "SGLog_" + date + ".csv";
            a.click();
        }

        function render() {
            document.getElementById('status').innerText = "Hole " + currentHoleCount;
            setupRows();
        }

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
        window.onload = loadFromPhone;
    </script>
</body>
</html>
